name: scheduling-ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: portfolio-projects/03-appointment-scheduling } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: portfolio-projects/03-appointment-scheduling/package-lock.json }
      - run: npm ci
      - run: npm run db:reset
      - run: npm run check
      - run: npm audit --audit-level=high
